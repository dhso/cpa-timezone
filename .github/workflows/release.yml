name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        # cgo does not cross-compile cleanly, so every target builds on a native runner.
        # macOS stays on 15: the dylib's minimum OS version follows the build host, and CPA itself is built on 15.
        include:
          - { runner: ubuntu-24.04, goos: linux, goarch: amd64, ext: so }
          - { runner: ubuntu-24.04-arm, goos: linux, goarch: arm64, ext: so }
          - { runner: macos-15-intel, goos: darwin, goarch: amd64, ext: dylib }
          - { runner: macos-15, goos: darwin, goarch: arm64, ext: dylib }
          - { runner: windows-2025, goos: windows, goarch: amd64, ext: dll }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Test
        run: go test ./...
      - name: Build
        shell: bash
        env:
          EXT: ${{ matrix.ext }}
        run: go build -buildmode=c-shared -ldflags "-X main.version=${GITHUB_REF_NAME#v}" -o "out/codex-timezone.${EXT}" .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codex-timezone-${{ matrix.goos }}-${{ matrix.goarch }}
          path: out/codex-timezone.${{ matrix.ext }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: codex-timezone-*
      # The store wants <id>_<version>_<goos>_<goarch>.zip with the library at the zip root, plus checksums.txt.
      - name: Package and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          cd dist
          for dir in codex-timezone-*; do
            platform="${dir#codex-timezone-}"
            (cd "$dir" && zip -q "../codex-timezone_${version}_${platform%-*}_${platform#*-}.zip" codex-timezone.*)
          done
          sha256sum codex-timezone_*.zip > checksums.txt
          gh release create "$GITHUB_REF_NAME" codex-timezone_*.zip checksums.txt \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
